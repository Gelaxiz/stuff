<!DOCTYPE html>
<html lang="en">

<head>
   <script>
      const theme = localStorage.getItem("nexusTheme") || "default";

      document.documentElement.classList.add("theme-" + theme);

      if (theme === "minecraft") {
         document.documentElement.classList.add("minecraft-theme");
      }

      if (window.self !== window.top) {
         document.documentElement.classList.add("in-frame");
      }
   </script>

   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <meta http-equiv="X-UA-Compatible" content="ie=edge">

   <title>szvyflix</title>

   <link rel="icon" href="/favicon.ico" type="image/x-icon">
   <link rel="stylesheet" href="./styles.css">
     <link href="/storage/css/cursor.css" rel="stylesheet">

  <script src="/storage/js/cursor.js"></script>
</head>

<body>

   <nav>
      <h1>szvyflix</h1>

      <div>
         <a href="./index.html">home</a>
         <a href="./movies.html">movies</a>
      </div>
   </nav>

   <main>
      <h1>popular movies</h1>

      <div class="results"></div>

      <button id="next-page" type="button">next page</button>
   </main>

   <script src="./popular.js"></script>

   <script>
      if (
         localStorage.getItem("nexusTheme") === "minecraft" &&
         window.self === window.top
      ) {
         const script = document.createElement("script");
         script.type = "module";
         script.src = "/storage/themes/minecraft/theme.js";
         document.body.appendChild(script);
      }
   </script>

</body>

</html>
