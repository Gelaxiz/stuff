```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: black;
      font-family: Arial, sans-serif;
    }

    #continue-screen {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      background: black;
      color: white;
      font-size: 24px;
      cursor: pointer;
      user-select: none;
    }

    #video {
      display: none;
      width: 100%;
      height: 100%;
      background: black;
      object-fit: contain;
    }
  </style>
</head>

<body>
  <div id="continue-screen">click to continue</div>

  <video id="video" playsinline></video>

  <script>
    const continueScreen = document.getElementById("continue-screen");
    const video = document.getElementById("video");
    const randomVideo = Math.floor(Math.random() * 5) + 1;

    video.src = `./${randomVideo}.mp4`;

    continueScreen.addEventListener("click", async () => {
      continueScreen.style.display = "none";
      video.style.display = "block";

      try {
        await video.play();
      } catch {
        continueScreen.style.display = "flex";
        video.style.display = "none";
      }
    });
  </script>
</body>
</html>
