<!DOCTYPE html>
<html lang="en">
  <head>
   <script>
      const theme = localStorage.getItem("nexusTheme") || "default";

      document.documentElement.classList.add("theme-" + theme);

      if (theme === "minecraft") {
         document.documentElement.classList.add("minecraft-theme");
      }

      if (window.self !== window.top) {
         document.documentElement.classList.add("in-frame");
      }
   </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>szvyflix</title>
    <link rel="stylesheet" href="./styles.css">
      <link href="/storage/css/cursor.css" rel="stylesheet">

  <script src="/storage/js/cursor.js"></script>
  </head>
  <body>
    <nav>
      <h1>szvyflix</h1>
      <div>
        <a href="./index.html">Home</a>
        <a href="./movies.html">Movies</a>
      </div>
    </nav>
    <main>
        <h1>szvyflix</h1>
        <p>free movies, at any time</p>
        <input id="search" autocomplete="off" placeholder="Search for a movie...">
        <button id="discover">Discover</button>
    </main>
    
   <script>
      if (
         localStorage.getItem("nexusTheme") === "minecraft" &&
         window.self === window.top
      ) {
         const script = document.createElement("script");
         script.type = "module";
         script.src = "/storage/themes/minecraft/theme.js";
         document.body.appendChild(script);
      }
   </script>
    <script src="./index.js"></script>
  </body>
</html>
