<!doctype html>
<html lang="en">
<head>
  <script>
    const theme = localStorage.getItem("nexusTheme") || "default";
    document.documentElement.classList.add("theme-" + theme);
    if (window.self !== window.top) document.documentElement.classList.add("in-frame");
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08090c">
  <title>Games · Nexus</title>
  <link rel="icon" href="../storage/images/googleclassroom.png" type="image/png">
  <link rel="stylesheet" href="../storage/css/background.css">
  <link rel="stylesheet" href="../storage/css/games-library.css">
  <link rel="stylesheet" href="/storage/css/cursor.css">
  <script src="/storage/js/cursor.js" defer></script>
  <script src="/storage/js/settings.js" defer></script>
  <script src="/storage/js/games-library.js" defer></script>
</head>
<body>
  <main class="library-shell">
    <header class="library-header">
      <div>
        <h1>Games</h1>
        <p id="gamesTitle" aria-live="polite">Loading the library…</p>
      </div>
      <button id="random-button" class="surprise-button" type="button" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
        Surprise me
      </button>
    </header>
    <section class="library-tools" aria-label="Game library controls">
      <label class="search-control" for="gameSearch">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></svg>
        <input type="search" id="gameSearch" autocomplete="off" placeholder="Search by title" spellcheck="false">
        <kbd>/</kbd>
      </label>
      <div class="filter-row" id="genreFilters" aria-label="Filter games">
        <button type="button" class="filter-button is-active" data-filter="all" aria-pressed="true">All</button>
        <button type="button" class="filter-button" data-filter="classic" aria-pressed="false">Classics</button>
        <button type="button" class="filter-button" data-filter="arcade" aria-pressed="false">Arcade</button>
        <button type="button" class="filter-button" data-filter="sports" aria-pressed="false">Sports</button>
        <button type="button" class="filter-button" data-filter="adventure" aria-pressed="false">Adventure</button>
      </div>
    </section>
    <div id="libraryStatus" class="library-status" role="status">
      <span class="status-spinner" aria-hidden="true"></span>
      Loading games
    </div>
    <section class="game-grid" id="gameGrid" aria-label="Games"></section>
    <section id="emptyState" class="empty-state" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 11h12l2 7-3 2-3-3h-4l-3 3-3-2 2-7Z"/><path d="M9 14h-3M7.5 12.5v3M15.5 14h.01M18 14h.01"/></svg>
      <h2>No games found</h2>
      <p>Try a shorter title or choose another category.</p>
      <button id="clearSearch" type="button">Clear search</button>
    </section>
  </main>
  <noscript>This game library requires JavaScript to load its catalog.</noscript>
</body>
</html>
