<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>home</title>

   <link rel="icon" href="/storage/images/googleclassroom.png" type="image/png">
   <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
   <link href="/storage/css/iframe.css" rel="stylesheet">
   <link href="/storage/css/cursor.css" rel="stylesheet">

   <script src="/storage/js/cursor.js"></script>
</head>

<body>
   <main class="frame-page">
      <section class="game-panel">
         <div class="game-shell">
            <iframe
               id="game-frame"
               class="game-iframe"
               allow="fullscreen; autoplay; clipboard-read; clipboard-write; gamepad; microphone; camera; display-capture"
               allowfullscreen
               tabindex="0">
            </iframe>
         </div>

         <div class="frame-controls">
            <button id="reload-button" type="button"><i class="fa-solid fa-rotate-right"></i></button>
            <button id="fullscreen-button" type="button"><i class="fa-solid fa-expand"></i></button>
            <button id="blank-button" type="button"><i class="fa-solid fa-up-right-from-square"></i></button>
            <button id="downloads-button" type="button"><i class="fa-solid fa-file-arrow-down"></i></button>
         </div>
      </section>
   </main>

   <script src="/ultraviolet/uv/uv.bundle.js"></script>
   <script src="/ultraviolet/uv/uv.config.js"></script>

   <script>
      const gameFrame = document.getElementById("game-frame");
      const reloadButton = document.getElementById("reload-button");
      const fullscreenButton = document.getElementById("fullscreen-button");
      const blankButton = document.getElementById("blank-button");
      const downloadsButton = document.getElementById("downloads-button");

      const DEFAULT_URL = "https://play.geforcenow.com/";

      async function registerUV() {
         if (!("serviceWorker" in navigator)) return;

         await navigator.serviceWorker.register("/ultraviolet/uv-sw.js", {
            scope: "/ultraviolet/"
         });

         await navigator.serviceWorker.ready;
      }

      function encodeUV(url) {
         return __uv$config.prefix + __uv$config.encodeUrl(url);
      }

      async function loadGFN() {
         try {
            await registerUV();

            if (!window.__uv$config || !__uv$config.prefix || !__uv$config.encodeUrl) {
               gameFrame.src = "/404";
               return;
            }

            gameFrame.src = encodeUV(DEFAULT_URL);
         } catch (err) {
            console.error("UV failed:", err);
            gameFrame.src = "/404";
         }
      }

      function reloadFrame() {
         gameFrame.src = gameFrame.src;
      }

      function fullscreenFrame() {
         if (!document.fullscreenElement) {
            gameFrame.requestFullscreen().catch(() => {});
         } else {
            document.exitFullscreen();
         }
      }

      function openInAboutBlank() {
         const tab = window.open("about:blank", "_blank");
         if (!tab) return;

         tab.document.title = "home";

         const icon = tab.document.createElement("link");
         icon.rel = "icon";
         icon.href = "/storage/images/googleclassroom.png";
         tab.document.head.appendChild(icon);

         tab.document.body.style.margin = "0";
         tab.document.body.style.overflow = "hidden";
         tab.document.body.style.background = "black";

         const frame = tab.document.createElement("iframe");
         frame.src = gameFrame.src;
         frame.allowFullscreen = true;
         frame.allow = "fullscreen; autoplay; clipboard-read; clipboard-write; gamepad; microphone; camera; display-capture";
         frame.style.width = "100vw";
         frame.style.height = "100vh";
         frame.style.border = "0";

         tab.document.body.appendChild(frame);
      }

      function downloadIframePage() {
         const html = `<!DOCTYPE html>
<html>
<head>
<title>geforce-now</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
iframe{width:100vw;height:100vh;border:0}
</style>
</head>
<body>
<iframe src="${gameFrame.src}" allowfullscreen allow="fullscreen; autoplay; clipboard-read; clipboard-write; gamepad; microphone; camera; display-capture"></iframe>
</body>
</html>`;

         const blob = new Blob([html], { type: "text/html" });
         const link = document.createElement("a");
         link.href = URL.createObjectURL(blob);
         link.download = "geforce-now.html";
         document.body.appendChild(link);
         link.click();
         link.remove();
         URL.revokeObjectURL(link.href);
      }

      gameFrame.addEventListener("load", () => gameFrame.focus());
      gameFrame.addEventListener("click", () => gameFrame.focus());

      reloadButton.addEventListener("click", reloadFrame);
      fullscreenButton.addEventListener("click", fullscreenFrame);
      blankButton.addEventListener("click", openInAboutBlank);
      downloadsButton.addEventListener("click", downloadIframePage);

      window.addEventListener("DOMContentLoaded", loadGFN);
   </script>

   <script src="/storage/js/settings.js"></script>
</body>
</html>
