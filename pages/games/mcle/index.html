<!DOCTYPE html>
<html lang="en">

<head>
   <script>
      const theme = localStorage.getItem("nexusTheme") || "default";

      document.documentElement.classList.add("theme-" + theme);

      if (theme === "minecraft") {
         document.documentElement.classList.add("minecraft-theme");
      }

      if (window.self !== window.top) {
         document.documentElement.classList.add("in-frame");
      }
   </script>

   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">

   <title>Classom - Google</title>

   <link rel="icon" href="/storage/images/googleclassroom.png" type="image/png">
   <link rel="stylesheet" href="./lce.css">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>

   <main class="lce-page">
      <section class="lce-card">
         <div class="lce-icon">
            <i class="fa-solid fa-cube"></i>
         </div>

         <h1>Minecraft Legacy Edition</h1>

         <p>
            Minecraft Legacy Edition does not work inside an iframe.
         </p>

         <p class="lce-small">
            Open one of the links below in the main tab.
         </p>

         <div class="lce-actions">
            <a href="https://lce-wasm.vercel.app/" target="_blank" class="lce-button">
               open link 1
            </a>

            <a href="https://nexuslce.global.ssl.fastly.net/" target="_blank" class="lce-button secondary">
               open link 2 
            </a>
         </div>
      </section>
   </main>

   <script>
      if (
         localStorage.getItem("nexusTheme") === "minecraft" &&
         window.self === window.top
      ) {
         const script = document.createElement("script");
         script.type = "module";
         script.src = "/storage/themes/minecraft/theme.js";
         document.body.appendChild(script);
      }
   </script>

</body>

</html>
